[project]
name = "cachemind"
version = "0.1.0"
description = "A provider-agnostic semantic cache for OpenAI-compatible LLM APIs, with measured latency, cost and correctness."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.4.6",
    "prometheus-client>=0.26.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
redis = [
    "redisvl>=0.27"  # 0.27.2 is the only version exercised; the API differs in older releases,
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_cache"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
