name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0  # no floating v8+ tag exists; pin the exact release
      - run: uv sync --extra redis
      - run: uv run pytest -q
        # The live Redis test is skipped unless REDIS_URL is set; CI makes no paid API calls.
